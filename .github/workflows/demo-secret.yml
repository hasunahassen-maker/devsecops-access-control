name: Check demo secret
on: workflow_dispatch
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm demo secret is configured
        env:
          DINEDESK_DEMO_KEY: ${{ secrets.DINEDESK_DEMO_KEY }}
        run: |
          if [ -z "$DINEDESK_DEMO_KEY" ]; then
            printf '%s\n' 'DINEDESK_DEMO_KEY is missing' >&2
            exit 1
          fi
          printf '%s\n' 'DINEDESK_DEMO_KEY is configured'
